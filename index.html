<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DropZone | Gaming Marketplace</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#0c0d16;color:#fff;font-family:Arial,sans-serif}

header{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29283d}

.logo{font-size:25px;font-weight:900;color:#61e8f5}

nav a{color:#ddd;text-decoration:none;margin-left:16px}

.hero{padding:70px 7%;background:linear-gradient(120deg,#241642,#102d40)}

.hero h1{font-size:clamp(38px,7vw,65px);margin:0 0 15px}

.hero h1 span{color:#61e8f5}

p{color:#b8bbce;line-height:1.6}

.btn{display:inline-block;padding:13px 19px;border:0;border-radius:9px;background:#61e8f5;color:#10111a;font-weight:bold;text-decoration:none;cursor:pointer}

main{padding:30px 7%}

input,select{padding:12px;border-radius:8px;border:1px solid #34354e;background:#171827;color:white}

input{width:100%;margin:10px 0}

.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}

.filters input{flex:1;min-width:180px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}

.card{background:#171827;border:1px solid #303148;border-radius:15px;overflow:hidden}

.art{height:140px;background:linear-gradient(135deg,#5d32a2,#146477);display:grid;place-items:center;font-size:55px}

.card-content{padding:18px}

.price{font-size:24px;font-weight:bold;color:#61e8f5}

.card button{width:100%;margin-top:12px}

section h2{margin-top:20px}

form{max-width:500px;background:#171827;border:1px solid #303148;padding:20px;border-radius:14px}

form input,form select{width:100%;margin:8px 0 15px}

form button{width:100%}

footer{padding:25px 7%;border-top:1px solid #29283d;color:#aeb2c8;font-size:13px}

.notice{font-size:13px;border-left:3px solid #e9bd5b;padding:12px;background:#211e19}

@media(max-width:500px){header{padding:18px 5%}nav a{margin-left:8px;font-size:13px}.hero,main{padding:35px 5%}}

</style>

</head>

<body>

<header>

  <div class="logo">DROPZONE 🎮</div>

  <nav><a href="#browse">Browse</a><a href="#sell">Sell</a></nav>

</header>

<section class="hero">

  <h1>Your next gaming<br><span>upg
